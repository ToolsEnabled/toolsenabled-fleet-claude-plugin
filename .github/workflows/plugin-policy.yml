name: Vendor plugin boundaries
on: [push, pull_request]
permissions:
  contents: read
jobs:
  plugin-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test plugin-policy.test.js recover-state.test.js
